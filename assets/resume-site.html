  background: transparent; color: #f7f3ec;

.sc-print:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }

    { group: "Leadership", items: ["Team Building", "OKRs", "Cross-functional", "0→1 & 1→10"] }
  ],

  awards: [
    { title: "Jet.com — Editors' Choice + Best Apps of 2015 (App Store + Play Store)", dates: "2015" }
  ]
};
</script>

<script type="text/babel">
/* ============================================================
   Editorial Resume — 2 pages, always rendered together
   ============================================================ */
const EditorialResume = ({ data = window.SAMPLE, theme = "amber" }) => {
  const work = data.work || [];
  const pageOneJobs = work.slice(0, 3);
  const pageTwoJobs = work.slice(3);

  return (
    <>
      {/* Page 1 */}
      <div className="resume-page editorial" data-theme={theme} data-page="1">
        <header className="ed-mast">
          <div className="ed-mast-eyebrow">
            <span>{data.title}</span>
            <span>· {data.location}</span>
          </div>
          <h1 className="ed-name">
            {data.name.split(" ").map((w, i, arr) => (
              <span key={i} className={i === arr.length - 1 ? "ital-accent" : ""}>
                {w}{i < arr.length - 1 ? " " : ""}
              </span>
            ))}
          </h1>
          <div className="ed-mast-contact">
            <a href={`mailto:${data.email}`}>{data.email}</a>
            <span>·</span>
            <span>{data.website}</span>
            {data.links.slice(1).map((l, i) => (
              <React.Fragment key={i}><span>·</span><span>{l.label}</span></React.Fragment>
            ))}
          </div>
        </header>

        <div className="ed-hatch-band" />

        <section className="ed-section">
          <p className="ed-lede">{data.summary}</p>
          {data.consulting && <p className="ed-lede ed-lede-2">{data.consulting}</p>}
        </section>

        <section className="ed-section">
          <h2 className="ed-h2"><span className="ed-num">01</span> Selected Work</h2>
          <div className="ed-work">
            {pageOneJobs.map((job, i) => (
              <article key={i} className="ed-job">
                <div className="ed-job-meta">
                  <div className="ed-job-dates">{job.dates}</div>
                  <div className="ed-job-tags">{job.tags.join(" · ")}</div>
                </div>
                <div className="ed-job-body">
                  <h3 className="ed-job-role">
                    {job.role} <span className="ed-at">at</span> <em>{job.org}</em>
                    {job.where && <span className="ed-where"> · {job.where}</span>}
                  </h3>
                  <ul className="ed-bullets">
                    {job.bullets.map((b, j) => (
                      <li key={j}><span className="ed-arrow">→</span> {b}</li>
                    ))}
                  </ul>
                </div>
              </article>
            ))}
          </div>
        </section>

        <footer className="ed-foot">
          <span>{data.name}</span>
          <span>—</span>
          <span>Page 1 of 2 →</span>
        </footer>
      </div>

      {/* Page 2 */}
      <div className="resume-page editorial" data-theme={theme} data-page="2">
        <section className="ed-section">
          <h2 className="ed-h2"><span className="ed-num">01</span> Selected Work, cont.</h2>
          <div className="ed-work">
            {pageTwoJobs.map((job, i) => (
              <article key={i} className="ed-job">
                <div className="ed-job-meta">
                  <div className="ed-job-dates">{job.dates}</div>
                  <div className="ed-job-tags">{job.tags.join(" · ")}</div>
                </div>
                <div className="ed-job-body">
                  <h3 className="ed-job-role">
                    {job.role} <span className="ed-at">at</span> <em>{job.org}</em>
                    {job.where && <span className="ed-where"> · {job.where}</span>}
                  </h3>
                  <ul className="ed-bullets">
                    {job.bullets.map((b, j) => (
                      <li key={j}><span className="ed-arrow">→</span> {b}</li>
                    ))}
                  </ul>
                </div>
              </article>
            ))}
          </div>
          {data.earlyCareer && <p className="ed-early">{data.earlyCareer}</p>}
        </section>

        {data.side && data.side.length > 0 && (
          <section className="ed-section">
            <h2 className="ed-h2"><span className="ed-num">02</span> Side Projects</h2>
            <div className="ed-side">
              {data.side.map((s, i) => (
                <div key={i}>
                  <div className="ed-side-name">{s.name}</div>
                  <div className="ed-side-blurb">{s.blurb}</div>
                </div>
              ))}
            </div>
          </section>
        )}

        <section className="ed-section ed-grid">
          <div>
            <h2 className="ed-h2"><span className="ed-num">03</span> Education</h2>
            {data.education.map((e, i) => (
              <div key={i} className="ed-edu">
                <div className="ed-edu-school">{e.school}</div>
                <div className="ed-edu-degree">{e.degree}</div>
                <div className="ed-edu-dates">{e.dates}</div>
              </div>
            ))}
          </div>
          <div>
            <h2 className="ed-h2"><span className="ed-num">04</span> Recognition</h2>
            {data.awards.map((a, i) => (
              <div key={i} className="ed-award">
                <span>{a.title}</span>
                <span className="ed-award-date">{a.dates}</span>
              </div>
            ))}
          </div>
        </section>

        <footer className="ed-foot">
          <span>{data.name}</span>
          <span>—</span>
          <span>← Page 2 of 2</span>
        </footer>
      </div>
    </>
  );
};

/* ============================================================
   Controller — theme only
   ============================================================ */
const state = { theme: 'amber' };
const root = ReactDOM.createRoot(document.getElementById('root'));

function render() {
  document.documentElement.setAttribute('data-theme', state.theme);
  root.render(<EditorialResume theme={state.theme} />);
  document.querySelectorAll('#theme-tabs .sc-tab').forEach(b => {
    b.dataset.active = (b.dataset.themePick === state.theme) ? 'true' : 'false';
  });
}

document.querySelectorAll('#theme-tabs .sc-tab').forEach(b => {
  b.addEventListener('click', () => { state.theme = b.dataset.themePick; render(); });
});

render();
</script>

</body>
</html>
